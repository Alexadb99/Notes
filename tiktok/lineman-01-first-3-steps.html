<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Rubik:wght@800&family=Special+Elite&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,cv=document.getElementById('c'),g=cv.getContext('2d');
const Y='#f2c230',BONE='#ece2cf',RED='#d24a3a',DIRT='"Rubik Dirt", Impact, sans-serif',BLOCK='"Rubik", "Arial Black", sans-serif',TYPE='"Special Elite", monospace';
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// pre-render gritty concrete background
const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const b=bg.getContext('2d'),R=rng(7);
 const gr=b.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1d1e19');gr.addColorStop(1,'#0c0d0a');b.fillStyle=gr;b.fillRect(0,0,W,H);
 for(let y=0;y<H;y+=22){b.fillStyle=R()<.5?'rgba(255,250,235,.02)':'rgba(0,0,0,.08)';b.fillRect(0,y,W,22);b.fillStyle='rgba(0,0,0,.25)';b.fillRect(0,y+21,W,1);}
 for(let i=0;i<26000;i++){b.fillStyle=R()<.45?'rgba(235,230,215,.04)':'rgba(0,0,0,.4)';b.fillRect(R()*W,R()*H,R()*2,R()*2);}
 b.lineWidth=1;for(let i=0;i<200;i++){const x=R()*W,y=R()*H,l=10+R()*50,a=R()*Math.PI;b.strokeStyle='rgba(220,210,180,.05)';b.beginPath();b.moveTo(x,y);b.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);b.stroke();}
 const v=b.createRadialGradient(W/2,H*.45,W*.3,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');b.fillStyle=v;b.fillRect(0,0,W,H);}
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3),clamp=t=>t<0?0:t>1?1:t,lerp=(a,b,t)=>a+(b-a)*t;
const back=t=>{t=clamp(t);const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function lerpPose(a,b,t){const o={};for(const k in a)o[k]=[lerp(a[k][0],b[k][0],t),lerp(a[k][1],b[k][1],t)];return o;}
const GY=1360;
const P={
 stance:{head:[640,1100],sh:[575,1125],hip:[430,1150],kf:[505,1235],ff:[475,GY],kb:[385,1262],fb:[325,GY],el:[590,1235],ha:[600,GY]},
 high:{head:[505,850],sh:[488,915],hip:[455,1085],kf:[512,1215],ff:[490,GY],kb:[425,1222],fb:[385,GY],el:[540,990],ha:[590,975]},
 step1:{head:[690,1085],sh:[620,1108],hip:[470,1138],kf:[555,1228],ff:[530,GY],kb:[410,1258],fb:[340,GY],el:[660,1120],ha:[720,1100]},
 step2:{head:[760,1080],sh:[690,1102],hip:[545,1138],kf:[625,1230],ff:[600,GY],kb:[575,1262],fb:[520,GY],el:[735,1112],ha:[790,1095]},
 step3:{head:[835,1010],sh:[775,1045],hip:[640,1105],kf:[720,1225],ff:[700,GY],kb:[610,1255],fb:[540,GY],el:[830,1050],ha:[885,1030]}
};
function limb(a,b,w,col){g.lineCap='round';g.lineJoin='round';g.strokeStyle='#050505';g.lineWidth=w+10;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();}
function figure(p,col,alpha){g.save();g.globalAlpha=alpha==null?1:alpha;
 limb(p.hip,p.kb,40,shade(col));limb(p.kb,p.fb,36,shade(col));limb(p.hip,p.kf,42,col);limb(p.kf,p.ff,38,col);
 limb(p.hip,p.sh,64,col);limb(p.sh,p.el,32,col);limb(p.el,p.ha,30,col);
 g.fillStyle='#050505';g.beginPath();g.arc(p.head[0],p.head[1],50,0,7);g.fill();g.fillStyle=col;g.beginPath();g.arc(p.head[0],p.head[1],43,0,7);g.fill();
 g.strokeStyle='#050505';g.lineWidth=7;const dir=p.sh[0]>p.hip[0]?1:-1;g.beginPath();g.moveTo(p.head[0]+dir*22,p.head[1]-6);g.lineTo(p.head[0]+dir*52,p.head[1]+4);g.moveTo(p.head[0]+dir*22,p.head[1]+16);g.lineTo(p.head[0]+dir*50,p.head[1]+22);g.stroke();
 g.restore();}
function shade(c){return c===Y?'#b98e1c':c===RED?'#9a3328':'#a9a294';}
function defender(x,ang,alpha){g.save();g.globalAlpha=alpha;g.translate(x,GY);g.rotate(ang);
 const d={head:[-10,-505],sh:[-5,-440],hip:[10,-270],kf:[-40,-140],ff:[-20,0],kb:[45,-130],fb:[60,0],el:[-70,-370],ha:[-120,-390]};
 figure(d,RED,1);g.restore();}
function txt(s,x,y,size,font,col,opts){opts=opts||{};g.save();g.font=`${size}px ${font}`;g.textAlign=opts.align||'center';g.textBaseline='alphabetic';
 if(opts.rot){g.translate(x,y);g.rotate(opts.rot);x=0;y=0;}
 g.lineJoin='round';g.strokeStyle='#000';g.lineWidth=opts.stroke==null?size*.14:opts.stroke;g.globalAlpha=opts.a==null?1:opts.a;g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y);g.restore();}
function slam(s,x,y,size,font,col,t0,t){const k=back((t-t0)/.35);if(t<t0)return;g.save();g.translate(x,y);const sc=lerp(2.2,1,k);g.scale(sc,sc);txt(s,0,0,size,font,col,{a:clamp((t-t0)/.12)});g.restore();}
function label(n,title,t,t0){const k=ease((t-t0)/.4);g.save();g.globalAlpha=k;g.translate(lerp(-200,0,k),0);
 g.fillStyle=Y;g.fillRect(70,250,170,170);txt(String(n),155,385,150,DIRT,'#111',{stroke:0});txt(title,270,330,74,BLOCK,BONE,{align:'left'});g.restore();}
function ground(){g.fillStyle='#090a08';g.fillRect(0,GY,W,H-GY);g.fillStyle=Y;g.globalAlpha=.9;g.fillRect(0,GY,W,6);g.globalAlpha=1;
 g.strokeStyle='rgba(236,226,207,.12)';g.lineWidth=3;for(let x=0;x<W;x+=120){g.beginPath();g.moveTo(x,GY+6);g.lineTo(x-60,H);g.stroke();}}
function ball(x,y){g.save();g.translate(x,y);g.fillStyle='#5a2e14';g.strokeStyle='#050505';g.lineWidth=6;g.beginPath();g.ellipse(0,0,46,28,0,0,7);g.fill();g.stroke();g.strokeStyle=BONE;g.lineWidth=4;g.beginPath();g.moveTo(-18,0);g.lineTo(18,0);for(let i=-12;i<=12;i+=8){g.moveTo(i,-7);g.lineTo(i,7);}g.stroke();g.restore();}
function caption(s,t,t0,y){const a=clamp((t-t0)/.25);const lines=s.split('\n');lines.forEach((l,i)=>txt(l,W/2,(y||1600)+i*82,64,BLOCK,BONE,{a}));}
function brand(){txt('LINEMAN TIPS',W/2,150,44,TYPE,Y,{stroke:6});}
const T=26;
function render(t){
 g.drawImage(bg,0,0);
 // shake on impacts
 const shk=(t>16.6&&t<16.95)?(Math.random()-.5)*26:0;g.save();g.translate(shk,shk*.6);
 if(t<3){ // hook
  brand();
  slam('YOU LOSE',W/2,760,150,DIRT,BONE,.15,t);
  slam('THE BLOCK',W/2,920,150,DIRT,BONE,.55,t);
  slam('IN THE FIRST',W/2,1080,118,DIRT,BONE,.95,t);
  slam('3 STEPS.',W/2,1290,210,DIRT,Y,1.35,t);
 } else if(t<8.5){ // step 1
  brand();ground();label(1,'SHORT & FAST',t,3);
  const k=ease((t-4.3)/.6),p=lerpPose(P.stance,P.step1,k);
  ball(lerp(700,700,0),GY-30);figure(p,BONE);
  if(t>5){const a=clamp((t-5)/.4);g.save();g.globalAlpha=a;g.strokeStyle=Y;g.lineWidth=8;g.beginPath();g.moveTo(475,GY+60);g.lineTo(530,GY+60);g.moveTo(475,GY+40);g.lineTo(475,GY+80);g.moveTo(530,GY+40);g.lineTo(530,GY+80);g.stroke();g.restore();txt('6 IN',503,GY+150,54,BLOCK,Y,{a});}
  caption('6 inches. Not a lunge.\nA long first step = slow.',t,5.6);
 } else if(t<14){ // step 2
  brand();ground();label(2,'HIPS UNDER YOU',t,8.5);
  const k=ease((t-9.1)/.5);
  // wrong: high
  g.save();g.translate(-200,0);figure(P.high,'#77736a',.9);g.restore();
  if(t>10.1){const a=clamp((t-10.1)/.2);g.save();g.globalAlpha=a;g.strokeStyle=RED;g.lineWidth=22;g.lineCap='round';g.beginPath();g.moveTo(160,780);g.lineTo(440,1060);g.moveTo(440,780);g.lineTo(160,1060);g.stroke();g.restore();txt('TOO HIGH',300,720,64,BLOCK,RED,{a});}
  g.save();g.translate(180,0);figure(lerpPose(P.stance,P.step2,k),BONE);g.restore();
  if(t>11){const a=clamp((t-11)/.3);g.save();g.globalAlpha=a;g.setLineDash([24,16]);g.strokeStyle=Y;g.lineWidth=7;g.beginPath();g.moveTo(560,1030);g.lineTo(1040,1030);g.stroke();g.restore();txt('PAD LEVEL',880,1000,56,BLOCK,Y,{a});}
  caption('Snapped it high? Sink right away.\nLow man wins.',t,11.4);
 } else if(t<20){ // step 3 + pancake
  brand();ground();label(3,'ROLL THE HIPS',t,14);
  const k1=ease((t-14.6)/.7),k2=ease((t-15.9)/.7);
  const p=t<15.9?lerpPose(P.stance,P.step2,k1):lerpPose(P.step2,P.step3,k2);
  const fall=t<16.4?0:ease((t-16.4)/.9);
  g.save();g.translate(30,GY*(1-.78));g.scale(.78,.78);
  defender(lerp(860,830,fall),lerp(0,1.2,fall),1);
  figure(p,BONE);
  if(t>15.9){const a=clamp((t-15.9)/.3);g.save();g.globalAlpha=a;g.strokeStyle=Y;g.lineWidth=14;g.lineCap='round';g.beginPath();g.arc(600,1120,150,Math.PI*.95,Math.PI*1.6);g.stroke();g.fillStyle=Y;g.beginPath();g.moveTo(690,990);g.lineTo(640,960);g.lineTo(660,1020);g.closePath();g.fill();g.restore();txt('HIP SNAP',470,930,66,BLOCK,Y,{a});}
  g.restore();
  if(t>17)slam('PANCAKE.',W/2,820,170,DIRT,Y,17,t);
  caption('Drive through the target\nand roll your hips into it.',t,15.2,1620);
 } else if(t<24){ // recap
  brand();
  slam('SHORT.',W/2,720,190,DIRT,BONE,20.1,t);
  slam('LOW.',W/2,940,190,DIRT,BONE,20.7,t);
  slam('ROLL.',W/2,1160,190,DIRT,Y,21.3,t);
  if(t>22.2)caption('Win the first 3 steps,\nwin the rep.',t,22.2,1400);
 } else { // CTA
  brand();
  const a=clamp((t-24)/.3);txt('FOLLOW FOR',W/2,860,110,DIRT,BONE,{a});txt('MORE O-LINE',W/2,1000,110,DIRT,Y,{a});txt('TIPS',W/2,1140,110,DIRT,BONE,{a});
 }
 g.restore();
 // progress bar
 g.fillStyle='rgba(242,194,48,.85)';g.fillRect(0,H-12,W*t/T,12);
}
window.render=render;window.T=T;
</script></body></html>
